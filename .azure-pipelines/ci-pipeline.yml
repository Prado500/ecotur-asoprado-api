trigger: none

pr:
  branches:
    include:
      - develop
      - staging
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  - name: pythonVersion
    value: '3.14'
  - group: VG-ECOTUR-DEV

steps:
  - task: UsePythonVersion@0
    displayName: 'Configurar versión de Python'
    inputs:
      versionSpec: '$(pythonVersion)'

  - script: |
      pip install -e .[test,dev]
    displayName: 'Instalar dependencias (pyproject.toml)'

  # --soft: ruff/mypy do not block until the global gate is green (B-TESTS m4, ADR-0005). Remove it then.
  - script: |
      python scripts/check.py --soft format,ruff,mypy
    displayName: 'Compuerta de calidad (scripts/check.py)'
    env:
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      JWT_SECRET_KEY: "super_secreto_ficticio_para_el_ci_pipeline"
      MAIL_USERNAME: $(MAIL_USERNAME)
      MAIL_PASSWORD: $(MAIL_PASSWORD)