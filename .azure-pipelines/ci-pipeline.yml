trigger: none

pr:
  branches:
    include:
      - develop
      - staging
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  - name: pythonVersion
    value: '3.14'

steps:
  - task: UsePythonVersion@0
    displayName: 'Configurar versión de Python'
    inputs:
      versionSpec: '$(pythonVersion)'

  - script: |
      pip install -e .[test,dev] -c constraints.txt
    displayName: 'Instalar dependencias (pyproject.toml) + constraints.txt'

  # No env block: the suite fixes its own configuration in conftest.py (ADR-0013).
  - script: |
      python scripts/check.py
    displayName: 'Compuerta de calidad (scripts/check.py)'
