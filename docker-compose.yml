version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ecotur_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ecotur_network

volumes:
  postgres_data:
    name: ecotur_pg_data

networks:
  ecotur_network:
    driver: bridge